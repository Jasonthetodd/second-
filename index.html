<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>شكون زوج نور المستقبلي؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap">
<style>
:root{
  --bg:#e9f3ff; --bg2:#ffe9f0; --card:#ffffff; --ink:#1d1240; --muted:#6c5f93;
  --pink:#ff4f7b; --gold:#ffc93c; --violet:#6d4dff; --line:#1d1240;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0a22; --bg2:#27103a; --card:#1f1438; --ink:#f6efff; --muted:#b9a9dc; --line:#f6efff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0a22; --bg2:#27103a; --card:#1f1438; --ink:#f6efff; --muted:#b9a9dc; --line:#f6efff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 10% 8%,var(--bg2),transparent 55%),radial-gradient(circle at 92% 96%,var(--bg2),transparent 50%);
  display:grid;place-items:center;
}
.card{
  width:min(92vw,440px);margin:34px 0;
  background:var(--card);border:3px solid var(--line);border-radius:28px;
  box-shadow:8px 8px 0 var(--line);padding:32px 22px 26px;text-align:center;position:relative;
}
.badge{
  position:absolute;top:-22px;right:50%;transform:translateX(50%) rotate(-4deg);
  background:var(--gold);color:#1d1240;border:3px solid var(--line);
  border-radius:999px;padding:4px 18px;font-weight:800;font-size:.95rem;white-space:nowrap;
}
h1{margin:12px 0 18px;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.35;font-weight:900}
.dots{display:flex;justify-content:center;gap:10px;margin-bottom:24px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:transparent;transition:background .2s}
.dot.done{background:var(--violet)}
.dot.now{background:var(--gold)}
.choices{display:flex;gap:14px;animation:pop .3s ease}
.btn{
  flex:1;font:inherit;font-weight:800;font-size:1.35rem;height:68px;cursor:pointer;
  border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);
  color:#1d1240;transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn:focus-visible,.again:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.pink{background:var(--pink);color:#fff}
.gold{background:var(--gold)}
.res{font-size:clamp(2.4rem,12vw,3.4rem);font-weight:900;line-height:1.25;margin:10px 0 20px;animation:pop .45s cubic-bezier(.2,1.3,.3,1) both}
.name{
  font-size:clamp(3rem,16vw,4.4rem);font-weight:900;line-height:1.1;margin:4px 0;
  color:var(--pink);text-shadow:3px 3px 0 var(--line);animation:pop .45s cubic-bezier(.2,1.3,.3,1) both;
}
.joke{font-size:1.4rem;font-weight:800;margin:8px 0 22px;animation:pop .45s .2s ease both}
.sign{
  display:inline-block;background:var(--gold);color:#1d1240;
  border:3px solid #1d1240;border-radius:20px;box-shadow:5px 5px 0 #1d1240;
  padding:12px 28px;font-size:1.6rem;font-weight:900;transform:rotate(-3deg);
  animation:drop .55s .5s cubic-bezier(.2,1.2,.3,1) both;
}
.again{
  display:block;margin:26px auto 0;font:inherit;font-weight:800;cursor:pointer;
  background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;
  padding:8px 24px;box-shadow:3px 3px 0 var(--line);
}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-60px) rotate(8deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
.bit{position:fixed;top:-40px;z-index:30;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .choices,.res,.name,.joke,.sign{animation:none}
  .bit{display:none}
}
</style>
</head>
<body>
<main class="card">
  <div class="badge">اختبار نور ✨</div>
  <h1 id="q">شكون زوج نور المستقبلي ؟</h1>
  <div class="dots" id="dots"></div>
  <div id="stage" aria-live="polite"></div>
</main>

<script>
(function(){
  var steps=[['طويل','قصير'],['سمين','معضل'],['وسيم','بشع'],['غني','فقير']];
  var i=0,timer=null,locked=false;
  var q=document.getElementById('q'),dots=document.getElementById('dots'),st=document.getElementById('stage');

  function drawDots(){
    dots.innerHTML=steps.map(function(_,k){
      return '<span class="dot'+(k<i?' done':(k===i?' now':''))+'"></span>';
    }).join('');
  }

  function ask(){
    locked=false;
    q.style.display='';dots.style.display='';
    drawDots();
    var s=steps[i];
    st.innerHTML='<div class="choices">'+
      '<button class="btn pink" type="button">'+s[0]+'</button>'+
      '<button class="btn gold" type="button">'+s[1]+'</button></div>';
    Array.prototype.forEach.call(st.querySelectorAll('.btn'),function(b){
      b.addEventListener('click',function(){
        if(locked)return;
        locked=true;i++;
        if(i<steps.length)ask();else result();
      });
    });
  }

  function result(){
    drawDots();
    st.innerHTML='<p class="res">براد بيت؟ 😲</p>';
    timer=setTimeout(reveal,2600);
  }

  function reveal
